[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-forwarder"
version = "0.2.0"
description = "Telegram group/channel content forwarder with progress tracking"
requires-python = ">=3.9"
readme = "README.md"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "telethon>=1.44.0",
    "Pillow>=10.0.0",
    "Flask>=3.1,<4",
    "Werkzeug>=3.1,<4",
    "waitress>=3.0,<4",
    "python-dotenv>=1.0.0",
    "python-socks[asyncio]>=2.4.0",
]

[project.urls]
Repository = "https://github.com/bashirian777/tg-forward"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
tg-forward = "tg_forwarder.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tg_forwarder", "tg_forwarder.*"]

[tool.setuptools.package-data]
"tg_forwarder.web" = ["dist/*", "dist/assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
