<div class="modal" id="config-modal" hidden role="dialog" aria-modal="true" tabindex="-1">
  <div class="modal-panel settings-modal-panel">
    <div class="modal-head">
      <div>
        <h2>编辑运行配置</h2>
        <div class="subtitle">登录设置可随时修改；修改传输参数需先停止全部任务</div>
      </div>
      <button class="modal-close" data-close="config-modal" aria-label="关闭">
        <span data-icon="x"></span>
      </button>
    </div>
    <form id="config-form">
      <div class="form-grid">
        <div class="form-field full">
          <label for="config-form-temp">临时目录</label
          ><input id="config-form-temp" required /><span class="hint"
            >媒体处理期间用于落盘的工作目录</span
          >
        </div>
        <div class="form-field">
          <label for="config-form-concurrency">最大并发媒体组</label
          ><input id="config-form-concurrency" type="number" min="1" required />
        </div>
        <div class="form-field">
          <label for="config-form-mindisk">最低剩余磁盘（MB）</label
          ><input id="config-form-mindisk" type="number" min="0" required />
        </div>
        <div class="form-field full">
          <label for="config-form-cleanup">临时文件保留周期（小时）</label
          ><input id="config-form-cleanup" type="number" min="0" step="0.1" required />
        </div>
        <div class="form-field">
          <label for="config-form-download">下载分块并发数</label
          ><input id="config-form-download" type="number" min="1" max="16" required />
        </div>
        <div class="form-field">
          <label for="config-form-upload">上传分块并发数</label
          ><input id="config-form-upload" type="number" min="1" max="16" required />
        </div>
        <div class="form-field">
          <label for="config-form-ttl">登录有效期（小时）</label
          ><input id="config-form-ttl" type="number" min="0.001" step="any" required /><span
            class="hint"
            >影响下次登录，页面刷新不延长有效期</span
          >
        </div>
        <div class="form-field full">
          <label for="config-form-password">Web 管理密码</label
          ><input
            id="config-form-password"
            type="password"
            autocomplete="new-password"
            placeholder="留空表示不修改"
          /><span class="hint">修改后现有登录会立即失效</span>
        </div>
      </div>
      <div class="modal-error" id="config-form-error"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close="config-modal">取消</button>
        <button class="btn primary" type="submit" id="config-submit">保存配置</button>
      </div>
    </form>
  </div>
</div>
