<div class="modal" id="errors-modal" hidden role="dialog" aria-modal="true" tabindex="-1">
  <div class="modal-panel error-modal-panel">
    <div class="modal-head">
      <div>
        <h2>传输错误</h2>
        <div class="subtitle" id="errors-modal-subtitle">—</div>
      </div>
      <button class="modal-close" data-close="errors-modal" aria-label="关闭">
        <span data-icon="x"></span>
      </button>
    </div>
    <div class="error-list" id="error-list"></div>
    <div class="modal-error" id="errors-modal-error"></div>
    <div class="modal-actions">
      <button type="button" class="btn danger" id="clear-errors-btn">
        <span data-icon="trash"></span><span>清空错误记录</span>
      </button>
      <button type="button" class="btn ghost" data-close="errors-modal">关闭</button>
    </div>
  </div>
</div>
