<div class="modal" id="confirm-modal" hidden role="dialog" aria-modal="true" tabindex="-1">
  <div class="modal-panel sm">
    <div class="modal-head">
      <div><h2 id="confirm-title">确认操作</h2></div>
      <button class="modal-close" data-close="confirm-modal" aria-label="关闭">
        <span data-icon="x"></span>
      </button>
    </div>
    <p class="confirm-message" id="confirm-message"></p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" data-close="confirm-modal">取消</button>
      <button type="button" class="btn danger" id="confirm-ok">确认</button>
    </div>
  </div>
</div>
