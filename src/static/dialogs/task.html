<div class="modal" id="task-modal" hidden role="dialog" aria-modal="true" tabindex="-1">
  <div class="modal-panel">
    <div class="modal-head">
      <div>
        <h2 id="task-modal-title">新建任务</h2>
        <p class="subtitle" id="task-modal-subtitle">创建后即可在列表中启动</p>
      </div>
      <button class="modal-close" data-close="task-modal" aria-label="关闭">
        <span data-icon="x"></span>
      </button>
    </div>
    <form id="task-form">
      <fieldset class="form-section">
        <legend>基本信息</legend>
        <div class="form-grid">
          <div class="form-field">
            <label for="task-form-id">任务 ID</label
            ><input
              id="task-form-id"
              required
              maxlength="48"
              placeholder="例如 daily_forward"
              autocomplete="off"
            /><span class="hint" id="task-id-hint">字母、数字、下划线和短横线</span>
          </div>
          <div class="form-field">
            <label for="task-form-note">任务名称 / 备注</label
            ><input
              id="task-form-note"
              maxlength="120"
              placeholder="一个便于识别的名称"
              autocomplete="off"
            />
          </div>
          <div class="form-field">
            <label for="task-form-source">来源频道 ID</label
            ><input
              id="task-form-source"
              type="number"
              required
              placeholder="-1001234567890"
            /><span class="hint">频道或群组通常使用负数 ID</span>
          </div>
          <div class="form-field">
            <label for="task-form-target">目标频道 ID</label
            ><input
              id="task-form-target"
              type="number"
              required
              placeholder="-1009876543210"
            /><span class="hint">登录账号需要具有发送权限</span>
          </div>
          <div class="form-field">
            <label for="task-form-min">最小转发间隔（秒）</label
            ><input id="task-form-min" type="number" min="0" step="0.1" required />
          </div>
          <div class="form-field">
            <label for="task-form-max">最大转发间隔（秒）</label
            ><input id="task-form-max" type="number" min="0" step="0.1" required /><span
              class="hint"
              id="delay-hint"
            ></span>
          </div>
        </div>
      </fieldset>
      <details class="advanced-fields" id="task-advanced">
        <summary>话题、描述与过滤规则</summary>
        <div class="form-grid">
          <div class="form-field">
            <label for="task-form-source-topic">来源话题 ID</label
            ><input
              id="task-form-source-topic"
              type="number"
              min="1"
              step="1"
              placeholder="可选"
            /><span class="hint">留空表示处理全部话题</span>
          </div>
          <div class="form-field">
            <label for="task-form-topic">目标话题 ID</label
            ><input id="task-form-topic" type="number" min="1" step="1" placeholder="可选" /><span
              class="hint"
              >用于论坛群组的指定话题</span
            >
          </div>
          <div class="form-field full">
            <label for="task-form-prefix">描述前缀</label
            ><input
              id="task-form-prefix"
              placeholder="转发描述前添加的文字，可留空"
              autocomplete="off"
            />
          </div>
          <div class="form-field">
            <label for="task-form-keywords">跳过关键词</label
            ><textarea id="task-form-keywords" placeholder="每行一个关键词"></textarea
            ><span class="hint">描述包含其中任意一个时跳过</span>
          </div>
          <div class="form-field">
            <label for="task-form-hashtags">必须包含的 Hashtag</label
            ><textarea id="task-form-hashtags" placeholder="每行一个标签"></textarea
            ><span class="hint">至少包含一个才转发，留空不过滤</span>
          </div>
        </div>
      </details>
      <fieldset class="form-section">
        <legend>转发行为</legend>
        <div class="switches" id="task-switches">
          <label class="switch"
            ><input id="task-form-enabled" type="checkbox" /><span class="track"></span
            ><span class="copy"
              ><span class="title">启用任务</span><span class="desc">关闭后任务无法启动</span></span
            ></label
          >
          <label class="switch"
            ><input id="task-form-hide" type="checkbox" checked /><span class="track"></span
            ><span class="copy"
              ><span class="title">隐藏转发来源</span
              ><span class="desc">目标消息不显示“转发自”</span></span
            ></label
          >
          <label class="switch" id="remove-switch"
            ><input id="task-form-remove" type="checkbox" /><span class="track"></span
            ><span class="copy"
              ><span class="title">删除已匹配 Hashtag</span
              ><span class="desc">从转发描述中移除匹配的标签</span></span
            ></label
          >
          <label class="switch"
            ><input id="task-form-send-as" type="checkbox" /><span class="track"></span
            ><span class="copy"
              ><span class="title">以目标频道身份发送</span
              ><span class="desc">登录账号需要目标频道的管理员权限</span></span
            ></label
          >
          <label class="switch"
            ><input id="task-form-dedup" type="checkbox" /><span class="track"></span
            ><span class="copy"
              ><span class="title">基于文件去重</span
              ><span class="desc">避免重复转发同一媒体文件</span></span
            ></label
          >
        </div>
      </fieldset>
      <fieldset class="form-section" id="source-reset-options" hidden>
        <legend>来源变更</legend>
        <div class="form-grid">
          <div class="form-field full">
            <label for="source-reset-id">新来源的起始消息 ID</label
            ><input id="source-reset-id" type="number" min="0" value="0" /><span class="hint"
              >更换来源后会清理旧传输记录，并从此位置继续</span
            >
          </div>
          <div class="form-field full">
            <label
              ><input id="source-reset-dedup" type="checkbox" checked />清空旧来源的去重记录</label
            >
          </div>
        </div>
      </fieldset>
      <div class="modal-error" id="task-form-error" role="alert"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close="task-modal">取消</button
        ><button class="btn primary" type="submit" id="task-submit">保存任务</button>
      </div>
    </form>
  </div>
</div>
