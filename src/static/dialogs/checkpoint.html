<div class="modal" id="checkpoint-modal" hidden role="dialog" aria-modal="true" tabindex="-1">
  <div class="modal-panel sm">
    <div class="modal-head">
      <div>
        <h2>修改任务断点</h2>
        <div class="subtitle">仅调整续传位置与统计，不会改动任务配置</div>
      </div>
      <button class="modal-close" data-close="checkpoint-modal" aria-label="关闭">
        <span data-icon="x"></span>
      </button>
    </div>
    <div class="checkpoint-identity">
      <div class="task-avatar"><span data-icon="flag"></span></div>
      <div>
        <div class="task-title" id="checkpoint-task-name">—</div>
        <div class="task-id" id="checkpoint-task-id">—</div>
      </div>
    </div>
    <form id="checkpoint-form">
      <div class="form-grid">
        <div class="form-field full">
          <label for="checkpoint-last-id"><span data-icon="flag"></span>last_message_id</label>
          <input id="checkpoint-last-id" type="number" min="0" required />
          <span class="hint">Telethon 的 min_id 语义：311 表示下一次从消息 312 开始。</span>
        </div>
        <div class="form-field full">
          <label for="checkpoint-count"><span data-icon="send"></span>已转发数量</label>
          <input id="checkpoint-count" type="number" min="0" required />
          <span class="hint">仅用于统计展示，不影响续传位置。</span>
        </div>
      </div>
      <div class="modal-error" id="checkpoint-error"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close="checkpoint-modal">取消</button>
        <button class="btn primary" type="submit" id="checkpoint-submit">保存断点</button>
      </div>
    </form>
  </div>
</div>
