<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Forwarder · 转发任务</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="auth-gate" id="auth-gate" hidden>
      <div class="auth-panel">
        <div class="auth-brand">
          <div class="brand-mark"><span data-icon="send"></span></div>
          <span>Forwarder</span>
        </div>
        <h1>欢迎回来</h1>
        <p>登录以管理你的 Telegram 转发任务。</p>
        <form id="auth-form">
          <label for="auth-password">管理密码</label>
          <input
            id="auth-password"
            type="password"
            autocomplete="current-password"
            placeholder="输入 Web 管理密码"
            required
          />
          <button class="btn primary block" type="submit" id="auth-submit">
            登录控制台<span data-icon="arrow"></span>
          </button>
          <p class="auth-error" id="auth-error" role="alert"></p>
        </form>
        <span class="auth-caption">Telegram Forwarder</span>
      </div>
    </div>
    <div id="app-content" hidden>
      <div class="admin-layout">
        <aside class="sidebar">
          <div class="sidebar-brand">
            <div class="brand-mark"><span data-icon="send"></span></div>
            <div><b>Forwarder</b><span>Telegram 转发控制台</span></div>
          </div>
          <div class="nav-label">工作空间</div>
          <nav class="sidebar-nav" aria-label="管理导航">
            <button class="nav-btn active" data-view="tasks" aria-current="page">
              <span data-icon="layers"></span><span>转发任务</span>
            </button>
            <button class="nav-btn" data-view="resources">
              <span data-icon="database"></span><span>系统资源</span>
            </button>
            <button class="nav-btn" data-view="settings">
              <span data-icon="sliders"></span><span>设置</span>
            </button>
            <button class="nav-btn" data-view="activity">
              <span data-icon="history"></span><span>操作记录</span>
            </button>
          </nav>
          <div class="sidebar-bottom">
            <div class="sidebar-status">
              <span class="dot" id="health-dot"></span>
              <div>
                <b id="sidebar-health">正在连接…</b><span id="sidebar-uptime">运行时间 —</span>
              </div>
            </div>
            <button class="btn ghost logout-btn" id="logout-btn" hidden>
              <span data-icon="lock"></span>退出登录
            </button>
          </div>
        </aside>
        <main class="main-area">
          <header class="topbar">
            <div>
              <h1 id="page-title">转发任务</h1>
              <p id="page-description">管理转发流程，查看实时进度</p>
            </div>
            <div class="topbar-actions">
              <button class="icon-btn" id="refresh-btn" aria-label="刷新数据" title="刷新数据">
                <span data-icon="refresh"></span></button
              ><button class="icon-btn" id="theme-btn" aria-label="切换主题" title="切换明暗主题">
                <span data-icon="moon"></span></button
              ><button class="btn primary" id="new-task-btn">
                <span data-icon="plus"></span><span>新建任务</span>
              </button>
            </div>
          </header>
          <div class="page-content">
            <div class="banner" id="banner" hidden role="alert">
              <span data-icon="alert"></span><span id="banner-text"></span>
            </div>
            <!-- include: views/tasks.html -->
            <!-- include: views/resources.html -->
            <!-- include: views/settings.html -->
            <!-- include: views/activity.html -->
            <footer>
              <span class="refresh-indicator"
                ><span class="dot"></span><span id="refresh-status">自动更新</span
                ><span class="footer-note">每 5 秒</span></span
              ><span>上次更新 <time id="last-updated">—</time></span>
            </footer>
          </div>
        </main>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span data-icon="check"></span><span id="toast-text"></span>
    </div>
    <!-- include: dialogs/task.html -->
    <!-- include: dialogs/checkpoint.html -->
    <!-- include: dialogs/settings.html -->
    <!-- include: dialogs/errors.html -->
    <!-- include: dialogs/confirm.html -->
    <noscript><div class="empty">请启用 JavaScript 以使用管理控制台。</div></noscript>
    <script src="/static/app.js" type="module"></script>
  </body>
</html>
