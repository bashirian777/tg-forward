<section class="view" data-page="tasks" aria-label="转发任务">
  <div class="stats">
    <div class="stat">
      <div class="stat-top"><span>全部任务</span><span data-icon="layers"></span></div>
      <div class="stat-num" id="stat-total">—</div>
      <span class="stat-label">已创建的转发流程</span>
    </div>
    <div class="stat green">
      <div class="stat-top"><span>运行中</span><span data-icon="play"></span></div>
      <div class="stat-num" id="stat-running">—</div>
      <span class="stat-label">正在处理来源消息</span>
    </div>
    <div class="stat amber">
      <div class="stat-top"><span>已暂停</span><span data-icon="pause"></span></div>
      <div class="stat-num" id="stat-paused">—</div>
      <span class="stat-label">保留断点，随时继续</span>
    </div>
    <div class="stat">
      <div class="stat-top"><span>累计转发</span><span data-icon="send"></span></div>
      <div class="stat-num" id="stat-forwarded">—</div>
      <span class="stat-label">已成功转发的消息</span>
    </div>
  </div>
  <div class="section-heading">
    <div>
      <h2>任务列表 <span class="count" id="task-count"></span></h2>
      <p>从断点继续，按任务独立控制。</p>
    </div>
    <span class="results" id="task-results" aria-live="polite"></span>
  </div>
  <div class="controls">
    <div class="search">
      <label class="sr-only" for="task-search">搜索任务</label><span data-icon="search"></span
      ><input
        id="task-search"
        type="search"
        placeholder="搜索任务、ID 或频道…"
        autocomplete="off"
      />
    </div>
    <div class="chips" id="task-chips" role="group" aria-label="任务筛选">
      <button class="chip active" data-filter="all" aria-pressed="true">全部</button
      ><button class="chip" data-filter="running" aria-pressed="false">运行中</button
      ><button class="chip" data-filter="paused" aria-pressed="false">已暂停</button
      ><button class="chip" data-filter="stopped" aria-pressed="false">已停止</button
      ><button class="chip" data-filter="transfer" aria-pressed="false">有传输</button
      ><button class="chip" data-filter="disabled" aria-pressed="false">已禁用</button>
    </div>
  </div>
  <div class="task-list" id="tasks"><div class="loading-state">正在加载任务…</div></div>
</section>
