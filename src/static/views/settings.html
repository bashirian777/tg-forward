<section class="view settings-view" data-page="settings" aria-label="设置" hidden>
  <article class="settings-card">
    <div class="section-heading">
      <div>
        <h2>运行设置</h2>
        <p>传输、存储与登录参数。</p>
      </div>
      <button class="btn" id="edit-config-btn"><span data-icon="edit"></span>编辑设置</button>
    </div>
    <dl class="config-panel">
      <div class="config-item full">
        <dt class="k">临时目录</dt>
        <dd class="v" id="config-temp-dir">—</dd>
      </div>
      <div class="config-item">
        <dt class="k">最大并发媒体组</dt>
        <dd class="v" id="config-concurrency">—</dd>
      </div>
      <div class="config-item">
        <dt class="k">最低剩余磁盘</dt>
        <dd class="v" id="config-min-disk">—</dd>
      </div>
      <div class="config-item">
        <dt class="k">下载 / 上传并发</dt>
        <dd class="v" id="config-workers">—</dd>
      </div>
      <div class="config-item">
        <dt class="k">临时文件保留周期</dt>
        <dd class="v" id="config-cleanup">—</dd>
      </div>
      <div class="config-item">
        <dt class="k">Web 管理密码</dt>
        <dd class="v" id="config-password">—</dd>
      </div>
      <div class="config-item">
        <dt class="k">登录有效期</dt>
        <dd class="v" id="config-auth-ttl">—</dd>
        <dd class="sub" id="auth-expiry">—</dd>
      </div>
      <div class="config-item full">
        <dt class="k">运行数据存储</dt>
        <dd class="v" id="config-storage-source">SQLite</dd>
      </div>
    </dl>
  </article>
  <article class="settings-card">
    <div class="section-heading">
      <div>
        <h2>Telegram 连接</h2>
        <p>用户账号与 Bot 的实时连接状态。</p>
      </div>
    </div>
    <div class="connection-grid" id="connection-panel">
      <span class="sub">正在获取连接状态…</span>
    </div>
  </article>
  <details class="settings-card deployment-details">
    <summary><span>部署信息</span><span class="sub">启动参数与配置来源</span></summary>
    <div class="config-panel" id="deployment-panel"></div>
    <p class="settings-footnote">
      启动参数从 .env 或系统环境读取，修改后重启生效。Telegram 登录使用命令行 login。
    </p>
  </details>
</section>
