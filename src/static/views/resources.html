<section class="view" data-page="resources" aria-label="系统资源" hidden>
  <div class="section-heading">
    <div>
      <h2>资源概况</h2>
      <p>关注可用空间，确保媒体传输顺利完成。</p>
    </div>
    <button class="btn" id="cleanup-temp-btn"><span data-icon="trash"></span>清理临时文件</button>
  </div>
  <div class="system-grid">
    <article class="card resource-card">
      <span class="resource-icon" data-icon="disk"></span>
      <div class="config-item">
        <span class="k">系统磁盘</span><span class="v" id="system-disk">—</span
        ><span class="sub" id="system-disk-sub">—</span>
      </div>
      <div class="progress"><div class="fill" id="disk-fill"></div></div>
    </article>
    <article class="card resource-card">
      <span class="resource-icon" data-icon="folder"></span>
      <div class="config-item">
        <span class="k">临时文件</span><span class="v" id="system-temp">—</span
        ><span class="sub" id="system-temp-sub">—</span>
      </div>
    </article>
    <article class="card resource-card">
      <span class="resource-icon" data-icon="activity"></span>
      <div class="config-item">
        <span class="k">系统负载</span><span class="v" id="system-load">—</span
        ><span class="sub" id="system-uptime">—</span>
      </div>
    </article>
  </div>
  <div class="info-note">
    <span data-icon="folder"></span>
    <div>
      <h3>临时文件会自动清理</h3>
      <p>
        手动清理会删除非活动传输的媒体与处理文件。正在使用的文件会保留，失败任务可能需要重新下载。
      </p>
    </div>
  </div>
</section>
