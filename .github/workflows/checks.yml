name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: python -m scripts.build_release --frontend-only
      - run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider
      - run: bash -n restart.sh
  frontend-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: python -m scripts.build_release
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: npm --prefix frontend test
        env:
          UI_PYTHON: python
      - run: python -m scripts.check_release dist/*.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: frontend/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
